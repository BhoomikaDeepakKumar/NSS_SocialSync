<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSS SocialSync - Profile</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Gowun+Dodum:wght@400&family=Hannari:wght@400&family=Poppins:wght@400;500;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400&family=Inter:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <main class="admin-panel-page">
    <div class="admin-panel">
      <div id="header-container"></div>

      <div class="main-container">
        <div id="sidebar-container"></div>

        <section class="content">
          <div class="breadcrumb-section">
            <h2 class="page-title">PROFILE</h2>
            <div class="breadcrumb">
              Home / <span class="current-page">Profile</span>
            </div>
          </div>

          <div class="profile-card-wrapper">
            <div class="profile-card">
  <!-- Edit button -->
  <button class="edit-btn">Edit</button>

  <div class="profile-header">
    <h3 id="profileUsername">Username</h3>
  

  <div class="profile-details">

  <!-- Email (NON-editable but looks same) -->
  <p><strong>EMAIL</strong>
    <span id="profileEmail" class="fixed-field"></span>
  </p>

  <!-- Volunteer ID (NON-editable but looks same) -->
  <p><strong>VOLUNTEER ID</strong>
    <span id="volunteerId" class="fixed-field"></span>
  </p>

  <!-- Full Name -->
  <p><strong>FULL NAME</strong>
    <span id="profileName"></span>
    <input type="text" id="profileNameInput" class="edit-input" style="display:none;">
  </p>

  <!-- Course -->
  <p><strong>COURSE</strong>
    <span id="profileCourse"></span>
    <input type="text" id="profileCourseInput" class="edit-input" style="display:none;">
  </p>

  <!-- Semester -->
  <p><strong>SEMESTER</strong>
    <span id="semester"></span>
    <input type="number" id="semesterInput" class="edit-input" style="display:none;">
  </p>

  <!-- Contact -->
  <p><strong>CONTACT</strong>
    <span id="profileContact"></span>
    <input type="text" id="profileContactInput" class="edit-input" style="display:none;">
  </p>

  <!-- Role -->
  <p><strong>AFFILIATION</strong>
    <span id="profileRole"></span>
    <select id="profileRoleInput" class="edit-input" style="display:none;">
      <option value="VOLUNTEER">Volunteer</option>
      <option value="MENTOR">Mentor</option>
      <option value="CORE">Core</option>
      <option value="FACULTY">Faculty</option>
    </select>
  </p>

</div>


</div>

          </div>

        </section>
      </div>
    </div>
  </main>
  <script src="/js/profile.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSS SocialSync - index</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/manage-users.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Gowun+Dodum:wght@400&family=Hannari:wght@400&family=Poppins:wght@400;500;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400&family=Inter:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <main class="admin-panel-page">
    <div class="admin-panel">
      <div id="header-container"></div>

      <div class="main-container">
        <div id="sidebar-container"></div>

        <section class="content">
          <div class="breadcrumb-section">
            <h2 class="page-title">MANAGE USERS</h2>
            <div class="breadcrumb">
              Home / <span class="current-page">Manage Users</span>
            </div>
          </div>



           <!-- 🔍 Search -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search by name or email..." />
    
  </div>

  <!-- Action Row (Above Table, Below Search) -->
<div class="action-row">
  <div class="left-actions">
    <button id="addSingleUserBtn" class="btn btn-primary">Add Single User</button>
    <button id="addBulkUsersBtn" class="btn btn-secondary">Add Bulk Users</button>
  </div>

  <div class="right-actions">
    <select id="bulkActionSelect">
      <option value="">Bulk Action</option>
      <option value="delete">Delete User</option>
      <option value="promote">Promote to Admin</option>
      <option value="demote">Demote to User</option>
    </select>
    <button id="applyBulkActionBtn" class="btn btn-primary">Apply</button>
  </div>
</div>


  <!-- 📋 Users Table -->
  <div class="users-table-container">
    <table class="users-table">
      <thead>
        <tr>
           <th><input type="checkbox" id="selectAllUsers" /></th> <!-- Select All -->
          <th>Full Name</th>
          <th>Email</th>
          <th>Volunteer ID</th>
          <th>Current Role</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        
      </tbody>
    </table>
  </div>
</section>
          
        </section>
      </div>
    </div>
  </main>
  <script src="/js/manage-users.js"></script>
  <script src="/js/main.js"></script>
</body>

</html>
